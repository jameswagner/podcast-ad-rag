name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  private-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if private or secret files are tracked
        run: |
          bad=$(git ls-files | grep -E '^private/|(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked private files:"; echo "$bad"; exit 1; fi
